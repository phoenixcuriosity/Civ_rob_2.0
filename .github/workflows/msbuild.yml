# documentation.

name: MSBuild + Cppcheck

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Cppcheck
      run: choco install cppcheck

    - name: Run cppcheck
      shell: pwsh
      run: |
        & "C:\Program Files\Cppcheck\cppcheck.exe" --enable=all --inconclusive --std=c++23 --platform=win64 --suppress=missingIncludeSystem --inline-suppr --check-level=exhaustive --force . 2> cppcheck.txt
        Get-Content cppcheck.txt

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

       # ── Install Clang toolset for Visual Studio ───────────────────────────────
    - name: Install LLVM/Clang VS component
      shell: pwsh
      run: |
        $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
          -latest -property installationPath
        & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
          --installPath "$vsPath" `
          --add Microsoft.VisualStudio.ComponentGroup.NativeDesktop.Llvm.Clang `
          --quiet --norestart --force


     # ── MSVC builds ───────────────────────────────────────────────────────────
    - name: Build MSVC Debug
      run: msbuild Civ_Rob_2.0.slnx /p:Configuration=Debug /p:Platform=x64

    - name: Build MSVC Release
      run: msbuild Civ_Rob_2.0.slnx /p:Configuration=Release /p:Platform=x64

    # ── Clang build ───────────────────────────────────────────────────────────
    - name: Build Clang Debug
      run: msbuild Civ_Rob_2.0.slnx /p:Configuration="Debug_clang" /p:Platform=x64
